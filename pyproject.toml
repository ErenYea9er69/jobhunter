[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jobhunter-mcp"
version = "2.0.1"
description = "Hybrid Claude Desktop MCP server: multi-board job search, hiring signals, resume-grounded tailoring, ATS audits, outreach drafts, and application tracking"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "JobHunter Maintainers" }]
keywords = ["mcp", "claude-desktop", "model-context-protocol", "job-search", "resume", "ats"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business",
]
dependencies = [
    "mcp[cli]>=1.9,<2",
    "curl_cffi>=0.7",
    "pypdf>=4.0",
]

[project.urls]
Homepage = "https://github.com/ErenYea9er69/jobhunter"
Repository = "https://github.com/ErenYea9er69/jobhunter"
"Bug Tracker" = "https://github.com/ErenYea9er69/jobhunter/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
jobhunter-mcp = "mcp_server:main"

[tool.setuptools]
py-modules = ["mcp_server"]

[tool.setuptools.packages.find]
include = ["jh*", "prompts*"]

[tool.setuptools.package-data]
"*" = ["*.md", "*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
