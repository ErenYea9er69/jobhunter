<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JobHunter</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<header class="head"><img src="icons/icon48.png" alt="" width="28" height="28"><strong>JobHunter</strong></header>
<main>
  <p class="state" id="state" role="status" aria-live="polite"><span class="dot bad" id="dot"></span><span id="state-text">Checking</span></p>
  <div class="who" id="who" hidden><span class="n" id="who-name" dir="auto"></span><span class="r" id="who-role" dir="auto"></span></div>
  <div class="note" id="note" hidden></div>
  <button class="btn primary" id="btn-panel" type="button">Open panel on this page</button>
  <p class="hint" id="hint">Opens beside the form. Shortcut: Alt+Shift+J.</p>
  <button class="btn secondary" id="btn-app" type="button">Open JobHunter</button>
</main>
<script src="popup.js"></script>
</body>
</html>
